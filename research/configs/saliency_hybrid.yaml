# Option 3: Saliency-Partitioned 64x64 Hybrid (PeccaviHybrid & SaliencyWAM) vs Baselines
# Single-command execution (no re-embedding):
#   python research/run_experiment.py --config research/configs/saliency_hybrid.yaml
name: saliency_hybrid
seed: 42
output_dir: experiments
dataset:
  name: pie_bench_pp
  subsets: null
  per_subset: 3
  max_images: 27
  rounds: 4
watermarks:
  - {name: none}          # B0 / FPR control track
  - {name: cs_wam, grid: [8, 8], k_fg: 8, k_bg: 24, top_k_tiles: 16, logit_temp: 2.0, trim_frac: 0.125, eot_steps: 35, eot_eps: 0.0627, eot_lr: 0.008, eot_mse_weight: 40.0}
  - {name: wam}
  - {name: trustmark}
editors:
  - {name: ip2p, steps: 50, text_cfg: 7.5, image_cfg: 1.5}
  - {name: sdedit, steps: 50, strength: 0.5, cfg: 7.5}
methods:
  - {name: baseline}      # Single-shot embedding at L0 (no re-embedding)
evaluation:
  target_fpr: 1.0e-3
  image_metrics: true
